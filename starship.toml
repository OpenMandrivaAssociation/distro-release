# OpenMandriva Starship prompt configuration.
# Uses ANSI color slots so terminal themes (e.g. Konsole om-colors) apply natively,
# and Hack Nerd Font Mono compatible glyphs. Users override via ~/.config/starship.toml.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
[┌──](bold bright-black)[\\(](bold bright-black)$username[@](bold bright-black)$hostname[\\)](bold bright-black)[─](bold bright-black)[\\[](bold bright-black)$directory$git_branch$git_commit$git_state$git_status$git_metrics[\\]](bold bright-black)
[└─](bold bright-black)$status$cmd_duration$python$nodejs$rust$golang$c$cpp$cmake$java$php$ruby$lua$perl$docker_context$kubernetes$terraform$aws$gcloud$nix_shell$shell$jobs$battery$memory_usage$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = "."
ssh_symbol = " "
style = "bold blue"
format = "[$ssh_symbol$hostname]($style)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
read_only_style = "bold red"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_commit]
tag_symbol = "  "
style = "bold bright-black"
format = " [$hash$tag]($style)"

[git_state]
style = "bold yellow"
format = " \\($state( $progress_current/$progress_total)\\)"

[git_status]
style = "bold yellow"
format = "( [$all_status$ahead_behind]($style))"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "( [+$added]($added_style))([ -$deleted]($deleted_style))"

[status]
disabled = false
style = "bold red"
symbol = " "
format = " [$symbol$status]($style)"

[cmd_duration]
min_time = 500
style = "bold bright-black"
format = " [$duration]($style)"

[battery]
disabled = false
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
style = "bold green"
format = " [$symbol$percentage]($style)"

[jobs]
symbol = " "
style = "bold yellow"
format = " [$symbol$number]($style)"

[memory_usage]
disabled = false
threshold = 90
symbol = "󰍛 "
style = "bold yellow"
format = " [$symbol${ram}]($style)"

[shell]
style = "bold bright-black"
format = " [$indicator]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = " [$symbol$context]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold blue"
format = " [$symbol$context( \\($namespace\\))]($style)"

[terraform]
symbol = " "
style = "bold purple"
format = " [$symbol$workspace]($style)"

[aws]
symbol = " "
style = "bold yellow"
format = " [$symbol($region)(\\($profile\\))]($style)"

[gcloud]
symbol = "󱇶 "
style = "bold blue"
format = " [$symbol$account(@$domain)(\\($region\\))]($style)"

[nix_shell]
symbol = " "
style = "bold cyan"
format = " [${symbol}${name}]($style)"

[python]
symbol = " "
format = " [${symbol}${version}( \\($virtualenv\\))]($style)"

[nodejs]
symbol = " "
format = " [${symbol}${version}]($style)"

[rust]
symbol = "󱘗 "
format = " [${symbol}${version}]($style)"

[golang]
symbol = " "
format = " [${symbol}${version}]($style)"

[c]
symbol = " "
format = " [${symbol}${version}]($style)"

[cpp]
symbol = " "
format = " [${symbol}${version}]($style)"

[cmake]
symbol = " "
format = " [${symbol}${version}]($style)"

[java]
symbol = " "
format = " [${symbol}${version}]($style)"

[php]
symbol = " "
format = " [${symbol}${version}]($style)"

[ruby]
symbol = " "
format = " [${symbol}${version}]($style)"

[lua]
symbol = " "
format = " [${symbol}${version}]($style)"

[perl]
symbol = " "
format = " [${symbol}${version}]($style)"

[character]
format = " $symbol "
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
vimcmd_symbol = "[<](bold blue)"
